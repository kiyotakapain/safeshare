<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeShare</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --blue: #185FA5;
    --blue-lt: #E6F1FB;
    --red: #A32D2D;
    --red-lt: #FCEBEB;
    --green: #3B6D11;
    --green-lt: #EAF3DE;
    --amber: #854F0B;
    --amber-lt: #FAEEDA;
    --radius: 14px;
    --radius-sm: 8px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }

  /* ── Nav ── */
  nav { background: var(--surface); border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 200; }
  .nav-top { max-width: 680px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; height: 54px; gap: 12px; }
  .nav-brand { font-size: 18px; font-weight: 700; flex: 1; }
  .nav-brand span { color: var(--blue); }
  .nav-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; justify-content: center; background: var(--red); color: #fff; border-radius: 99px; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 5px; cursor: pointer; }
  .nav-tabs { display: flex; border-top: 0.5px solid var(--border); max-width: 680px; margin: 0 auto; }
  .nav-tab { flex: 1; padding: 10px 0; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
  .nav-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* ── Layout ── */
  .container { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
  .section { display: none; }
  .section.active { display: block; }

  /* ── Buttons ── */
  .btn { cursor: pointer; border: none; border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; font-weight: 500; transition: all 0.15s; padding: 9px 18px; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: #0C447C; }
  .btn-outline { background: transparent; border: 0.5px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--bg); }
  .btn-sm { padding: 6px 13px; font-size: 13px; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.65s linear infinite; vertical-align: -2px; margin-right: 5px; }

  /* ── Cards ── */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }

  /* ── Forms ── */
  input, textarea { width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s; }
  input:focus, textarea:focus { border-color: var(--blue); }
  textarea { resize: vertical; min-height: 70px; }

  /* ── Composer ── */
  .composer-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .ctab { background: transparent; border: 0.5px solid var(--border); color: var(--muted); padding: 5px 14px; border-radius: 99px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .ctab.active { background: var(--blue-lt); border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .composer-footer { display: flex; justify-content: flex-end; margin-top: 10px; }
  #img-preview { width: 100%; border-radius: var(--radius-sm); margin-top: 8px; max-height: 320px; object-fit: cover; display: none; }

  /* ── Post ── */
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .post-author { font-weight: 600; font-size: 14px; }
  .post-time { font-size: 12px; color: var(--muted); }
  .post-body { font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .post-image { width: 100%; border-radius: var(--radius-sm); margin-bottom: 12px; max-height: 420px; object-fit: cover; display: block; }
  .divider { border: none; border-top: 0.5px solid var(--border); margin: 12px 0; }

  /* ── Comments ── */
  .comment { display: flex; gap: 9px; padding: 9px 0; border-top: 0.5px solid var(--border); }
  .comment-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
  .comment-author { font-weight: 600; font-size: 13px; }
  .comment-text { font-size: 14px; margin-top: 1px; word-break: break-word; }
  .comment-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .comment-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .comment-row input { flex: 1; }
  .analyzing { font-size: 12px; color: var(--muted); margin-top: 5px; display: none; }
  .toxic-warning { background: var(--red-lt); border: 0.5px solid #F09595; border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 10px; font-size: 13px; color: var(--red); line-height: 1.5; }

  /* ── Notifications ── */
  .notif { display: flex; gap: 10px; align-items: flex-start; padding: 13px 16px; border-bottom: 0.5px solid var(--border); }
  .notif:last-child { border-bottom: none; }
  .notif-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .notif-body { flex: 1; font-size: 14px; line-height: 1.5; }
  .notif-time { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .notif.unread { background: #fafcff; }

  /* ── Banned banner ── */
  .banned-banner { background: var(--red-lt); border: 1px solid #F09595; border-radius: var(--radius); padding: 18px 20px; text-align: center; margin-bottom: 20px; }
  .banned-banner h3 { color: var(--red); font-size: 16px; margin-bottom: 6px; }
  .banned-banner p { font-size: 14px; color: #791F1F; }

  /* ── Profile ── */
  .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .profile-av { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; }
  .profile-name { font-size: 19px; font-weight: 700; }
  .profile-user { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .stat-box { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
  .stat-val { font-size: 24px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .viol-bar-wrap { margin-top: 16px; padding: 14px; background: var(--bg); border-radius: var(--radius-sm); }
  .viol-bar { height: 6px; background: rgba(0,0,0,0.1); border-radius: 3px; margin: 8px 0 5px; overflow: hidden; }
  .viol-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; margin-top: 5px; }
  .tag-green { background: var(--green-lt); color: var(--green); }
  .tag-red { background: var(--red-lt); color: var(--red); }
  .tag-amber { background: var(--amber-lt); color: var(--amber); }

  /* ── Guidelines ── */
  .guideline { display: flex; gap: 10px; align-items: flex-start; padding: 11px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; }
  .guideline:last-child { border-bottom: none; }
  .guideline-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }

  /* ── Avatar palette ── */
  .av-blue   { background: var(--blue-lt);  color: var(--blue);  }
  .av-green  { background: var(--green-lt); color: var(--green); }
  .av-amber  { background: var(--amber-lt); color: var(--amber); }
  .av-red    { background: var(--red-lt);   color: var(--red);   }
  .av-purple { background: #EEEDFE; color: #534AB7; }
  .av-teal   { background: #E1F5EE; color: #0F6E56; }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }

  /* ── Section header ── */
  .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sec-title { font-size: 17px; font-weight: 700; }
</style>
</head>
<body>

<nav>
  <div class="nav-top">
    <div class="nav-brand">Safe<span>Share</span></div>
    <div class="nav-meta">
      <span id="nav-name"></span>
      <span id="nav-badge" class="badge" style="display:none" onclick="goTab('notifications')"></span>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-feed"          onclick="goTab('feed')">🏠 Feed</button>
    <button class="nav-tab"        id="tab-notifications" onclick="goTab('notifications')">🔔 Notifications</button>
    <button class="nav-tab"        id="tab-profile"       onclick="goTab('profile')">👤 Profile</button>
  </div>
</nav>

<!-- Feed -->
<div class="section active container" id="sec-feed">
  <div id="banned-banner" class="banned-banner" style="display:none">
    <h3>🚫 Account Suspended</h3>
    <p>Your account has been banned for repeatedly posting toxic comments (10+ violations). You can still read posts but cannot comment.</p>
  </div>

  <div class="card" id="composer">
    <div class="composer-tabs">
      <button class="ctab active" onclick="switchPostTab('text')" id="ctab-text">📝 Text</button>
      <button class="ctab"        onclick="switchPostTab('image')" id="ctab-img">🖼 Image URL</button>
    </div>
    <textarea id="post-text" placeholder="What's on your mind?"></textarea>
    <div id="img-wrap" style="display:none;margin-top:8px">
      <input type="url" id="post-img-url" placeholder="Paste an image URL…" oninput="previewImg()" />
      <img id="img-preview" />
    </div>
    <div class="composer-footer">
      <button class="btn btn-primary" id="post-btn" onclick="submitPost()">Share Post</button>
    </div>
  </div>

  <div id="feed-list"></div>
</div>

<!-- Notifications -->
<div class="section container" id="sec-notifications">
  <div class="sec-header">
    <div class="sec-title">Notifications</div>
    <button class="btn btn-outline btn-sm" onclick="clearNotifications()">Clear all</button>
  </div>
  <div class="card" id="notif-list" style="padding:0;overflow:hidden"></div>
</div>

<!-- Profile -->
<div class="section container" id="sec-profile">
  <div id="profile-content"></div>
</div>

<script>
// ─── State ───────────────────────────────────
let ME = null;
let postTab = 'text';

// ─── Init ────────────────────────────────────
(async () => {
  const r = await fetch('/api/me');
  if (!r.ok) { window.location.href = '/'; return; }
  const d = await r.json();
  ME = d.user;
  document.getElementById('nav-name').textContent = ME.display_name;
  updateBadge();
  goTab('feed');
})();

// ─── Navigation ──────────────────────────────
function goTab(tab) {
  ['feed','notifications','profile'].forEach(t => {
    document.getElementById('sec-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  if (tab === 'feed')          loadFeed();
  if (tab === 'notifications') loadNotifications();
  if (tab === 'profile')       renderProfile();
  if (tab === 'notifications') markRead();
}

function updateBadge() {
  const b = document.getElementById('nav-badge');
  const n = ME.unread_notifications || 0;
  b.style.display = n > 0 ? 'inline-flex' : 'none';
  b.textContent = n;
}

// ─── Auth ────────────────────────────────────
async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/';
}

// ─── Helpers ─────────────────────────────────
const AV_COLORS = ['av-blue','av-green','av-amber','av-purple','av-teal','av-red'];
function avColor(username) {
  let h = 0; for (const c of username) h = (h*31 + c.charCodeAt(0)) % AV_COLORS.length;
  return AV_COLORS[h];
}
function initials(name) {
  return name.split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2) || '?';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(iso) {
  const d = Date.now() - new Date(iso).getTime();
  if (d < 60000)   return 'just now';
  if (d < 3600000) return Math.floor(d/60000) + 'm ago';
  if (d < 86400000)return Math.floor(d/3600000) + 'h ago';
  return Math.floor(d/86400000) + 'd ago';
}
function avatarHTML(name, username, size=40) {
  const col = avColor(username);
  const fs  = Math.round(size * 0.35);
  return `<div class="avatar ${col}" style="width:${size}px;height:${size}px;font-size:${fs}px">${esc(initials(name))}</div>`;
}

// ─── Post composer ────────────────────────────
function switchPostTab(t) {
  postTab = t;
  document.getElementById('post-text').style.display = t==='text' ? 'block' : 'none';
  document.getElementById('img-wrap').style.display   = t==='image' ? 'block' : 'none';
  document.getElementById('ctab-text').classList.toggle('active', t==='text');
  document.getElementById('ctab-img').classList.toggle('active', t==='image');
}

function previewImg() {
  const url = document.getElementById('post-img-url').value.trim();
  const img = document.getElementById('img-preview');
  if (url) { img.src = url; img.style.display = 'block'; }
  else     { img.style.display = 'none'; }
}

async function submitPost() {
  const text     = document.getElementById('post-text').value.trim();
  const imageUrl = document.getElementById('post-img-url').value.trim();
  const content  = postTab === 'text' ? text : text;

  if (!content && !imageUrl) return;

  const btn = document.getElementById('post-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Posting…';

  try {
    const r = await fetch('/api/posts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ content, image_url: imageUrl })
    });
    const d = await r.json();
    if (!r.ok) { alert(d.error); return; }
    document.getElementById('post-text').value = '';
    document.getElementById('post-img-url').value = '';
    document.getElementById('img-preview').style.display = 'none';
    loadFeed();
  } catch(e) { alert('Error posting.'); }
  finally { btn.disabled = false; btn.textContent = 'Share Post'; }
}

// ─── Feed ─────────────────────────────────────
async function loadFeed() {
  if (ME.is_banned) {
    document.getElementById('banned-banner').style.display = 'block';
    document.getElementById('composer').style.display = 'none';
  }

  try {
    const r = await fetch('/api/posts');
    const d = await r.json();
    if (!r.ok) return;
    const list = document.getElementById('feed-list');
    if (!d.posts.length) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No posts yet. Be the first to share!</div>';
      return;
    }
    list.innerHTML = d.posts.map(renderPost).join('');
  } catch(e) {}
}

function renderPost(p) {
  const comments = (p.comments||[]).map(c => renderComment(c)).join('');
  const canComment = !ME.is_banned;
  const commentInput = canComment
    ? `<div class="comment-row">
         <input type="text" placeholder="Write a comment…" id="ci-${p.id}"
                onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();submitComment(${p.id})}" />
         <button class="btn btn-primary btn-sm" id="cb-${p.id}" onclick="submitComment(${p.id})">Post</button>
       </div>
       <div class="analyzing" id="ai-${p.id}">🔍 Analyzing for toxicity…</div>`
    : `<div style="font-size:13px;color:var(--red);margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border)">🚫 Your account is banned from commenting.</div>`;

  return `<div class="card" id="post-${p.id}">
    <div class="post-header">
      ${avatarHTML(p.author_display, p.author_username)}
      <div>
        <div class="post-author">${esc(p.author_display)}</div>
        <div class="post-time">${timeAgo(p.created_at)}</div>
      </div>
    </div>
    ${p.image_url ? `<img class="post-image" src="${esc(p.image_url)}" alt="post" onerror="this.style.display='none'">` : ''}
    ${p.content   ? `<div class="post-body">${esc(p.content)}</div>` : ''}
    <hr class="divider">
    <div id="comments-${p.id}">${comments}</div>
    ${commentInput}
  </div>`;
}

function renderComment(c) {
  return `<div class="comment">
    <div class="comment-av ${avColor(c.author_username)}">${esc(initials(c.author_display))}</div>
    <div>
      <div class="comment-author">${esc(c.author_display)}</div>
      <div class="comment-text">${esc(c.content)}</div>
      <div class="comment-time">${timeAgo(c.created_at)}</div>
    </div>
  </div>`;
}

// ─── Submit comment (with AI toxicity check) ──
async function submitComment(postId) {
  if (ME.is_banned) return;
  const input = document.getElementById('ci-'+postId);
  const text  = input.value.trim();
  if (!text) return;

  const btn       = document.getElementById('cb-'+postId);
  const indicator = document.getElementById('ai-'+postId);
  input.disabled  = true;
  btn.disabled    = true;
  btn.innerHTML   = '<span class="spinner"></span>';
  indicator.style.display = 'block';

  try {
    const r = await fetch(`/api/posts/${postId}/comments`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ content: text })
    });
    const d = await r.json();
    indicator.style.display = 'none';

    if (d.toxic) {
      // Update local state
      ME.unread_notifications = (ME.unread_notifications||0) + 1;
      if (d.just_banned) { ME.is_banned = true; ME.unread_notifications++; }
      ME.toxic_count = d.violation_count;
      updateBadge();

      // Show inline warning
      showToxicWarning(postId, d);

      input.value = '';
      if (d.banned) {
        document.getElementById('banned-banner').style.display = 'block';
        document.getElementById('composer').style.display = 'none';
        // Disable all comment inputs
        document.querySelectorAll('[id^="ci-"]').forEach(el => el.disabled = true);
        document.querySelectorAll('[id^="cb-"]').forEach(el => el.disabled = true);
      }
    } else {
      // Add new comment to DOM
      const commentsDiv = document.getElementById('comments-'+postId);
      commentsDiv.insertAdjacentHTML('beforeend', renderComment(d.comment));
      input.value = '';
    }
  } catch(e) {
    indicator.style.display = 'none';
    alert('Error posting comment. Please try again.');
  } finally {
    input.disabled = false;
    btn.disabled   = false;
    btn.textContent = 'Post';
  }
}

function showToxicWarning(postId, data) {
  // Remove any existing warning on this post
  document.querySelectorAll(`#post-${postId} .toxic-warning`).forEach(el => el.remove());

  const remaining = Math.max(0, 10 - data.violation_count);
  const banMsg    = data.just_banned ? '<br><strong>🚫 Your account has been permanently banned.</strong>' : `<br>${remaining} violation(s) remaining before permanent ban.`;

  const div = document.createElement('div');
  div.className = 'toxic-warning';
  div.innerHTML = `⚠️ <strong>Your comment was removed.</strong> Toxicity score: ${Math.round(data.score*100)}%.<br>${esc(data.reason||'')}${banMsg}`;

  const postEl = document.getElementById('post-'+postId);
  postEl.appendChild(div);

  // Auto-remove after 10 s
  setTimeout(() => div.remove(), 10000);
}

// ─── Notifications ────────────────────────────
async function loadNotifications() {
  const r = await fetch('/api/notifications');
  const d = await r.json();
  const list = document.getElementById('notif-list');
  if (!d.notifications.length) {
    list.innerHTML = '<div class="empty">No notifications yet.</div>';
    return;
  }
  list.innerHTML = d.notifications.map(n => {
    const icon = n.type==='banned' ? '🚫' : n.type==='toxic_own' ? '⚠️' : '📢';
    const bg   = n.type==='banned'||n.type==='toxic_own' ? 'background:var(--red-lt)' : 'background:var(--amber-lt)';
    return `<div class="notif ${n.is_read?'':'unread'}">
      <div class="notif-icon" style="${bg}">${icon}</div>
      <div class="notif-body">
        ${esc(n.message)}
        <div class="notif-time">${timeAgo(n.created_at)}</div>
      </div>
    </div>`;
  }).join('');
}

async function markRead() {
  await fetch('/api/notifications/read', { method: 'POST' });
  ME.unread_notifications = 0;
  updateBadge();
}

async function clearNotifications() {
  await fetch('/api/notifications', { method: 'DELETE' });
  ME.unread_notifications = 0;
  updateBadge();
  loadNotifications();
}

// ─── Profile ──────────────────────────────────
async function renderProfile() {
  // Refresh user data
  const r = await fetch('/api/me');
  const d = await r.json();
  ME = { ...ME, ...d.user };

  // Count posts/comments from feed (approximation; could add a dedicated endpoint)
  const fr = await fetch('/api/posts');
  const fd = await r.ok && fr.ok ? await fr.json() : { posts: [] };
  const postCount    = (fd.posts||[]).filter(p => p.author_username === ME.username).length;
  const commentCount = (fd.posts||[]).reduce((acc,p) => acc + (p.comments||[]).filter(c=>c.author_username===ME.username).length, 0);

  const pct     = Math.min(100, (ME.toxic_count||0) * 10);
  const barColor= ME.toxic_count >= 8 ? 'var(--red)' : ME.toxic_count >= 5 ? '#EF9F27' : 'var(--green)';
  const remaining = Math.max(0, 10 - (ME.toxic_count||0));

  document.getElementById('profile-content').innerHTML = `
    <div class="card">
      <div class="profile-header">
        <div class="profile-av ${avColor(ME.username)}">${esc(initials(ME.display_name))}</div>
        <div>
          <div class="profile-name">${esc(ME.display_name)}</div>
          <div class="profile-user">@${esc(ME.username)}</div>
          <div class="tag ${ME.is_banned ? 'tag-red' : 'tag-green'}">${ME.is_banned ? '🚫 Banned' : '✓ Active'}</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val">${postCount}</div><div class="stat-label">Posts</div></div>
        <div class="stat-box"><div class="stat-val">${commentCount}</div><div class="stat-label">Comments</div></div>
        <div class="stat-box">
          <div class="stat-val" style="color:${barColor}">${ME.toxic_count||0}</div>
          <div class="stat-label">Violations</div>
        </div>
      </div>
      ${!ME.is_banned ? `<div class="viol-bar-wrap">
        <div style="font-size:13px;color:var(--muted)">Violation limit: ${ME.toxic_count||0} / 10</div>
        <div class="viol-bar"><div class="viol-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div style="font-size:12px;color:var(--muted)">${remaining} remaining before ban</div>
      </div>` : ''}
    </div>

    <div class="sec-header"><div class="sec-title">Community Guidelines</div></div>
    <div class="card" style="padding:4px 16px">
      <div class="guideline"><div class="guideline-icon" style="background:var(--green-lt)">✓</div>Be respectful and constructive in all comments</div>
      <div class="guideline"><div class="guideline-icon" style="background:var(--green-lt)">✓</div>Share helpful, informative or creative content</div>
      <div class="guideline"><div class="guideline-icon" style="background:var(--green-lt)">✓</div>Disagree politely — healthy debate is welcome</div>
      <div class="guideline"><div class="guideline-icon" style="background:var(--red-lt)">✗</div>No hate speech, insults, threats, or harassment</div>
      <div class="guideline"><div class="guideline-icon" style="background:var(--red-lt)">✗</div>10 toxic comment violations = permanent account ban</div>
    </div>`;
}
</script>
</body>
</html>
